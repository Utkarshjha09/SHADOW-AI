<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SHADOW - Personal Voice Assistant with Hindi and English support" />
    <title>SHADOW Voice Assistant</title>
    <style>
      /* Loading screen styles */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        z-index: 9999;
      }
      .loading-logo { font-size: 3rem; margin-bottom: 1rem; }
      .loading-text { font-size: 1.2rem; margin-bottom: 2rem; }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading screen shown while React loads -->
      <div class="loading-screen" id="loading-screen">
        <div class="loading-logo">🤖</div>
        <div class="loading-text">SHADOW Voice Assistant</div>
        <div class="loading-spinner"></div>
      </div>
    </div>

    <!-- Mount React application -->
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide loading screen once React mounts (fallback on window load)
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.5s';
            setTimeout(function() { loadingScreen.remove(); }, 500);
          }
        }, 500);
      });
    </script>
  </body>
</html>
